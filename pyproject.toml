# Tooling config only. There is deliberately no [build-system]: cloudfit is a
# Claude Code plugin, not a package, and nothing here is meant to be installable.
[project]
name = "cloudfit"
version = "0.1.2"
description = "Fit a Slurm job to what it actually used."
requires-python = ">=3.10"
# mcp 2.x renamed FastMCP to MCPServer, so server.py's import fails there and the
# only symptom Claude Code shows is "Connection closed". Hold it to the v1 line.
dependencies = ["mcp>=1.28,<2"]
# Not Python imports -- cloudfit shells out to these, so they are external tools:
#   slurmwatch  live telemetry      pypi.org/project/slurmwatch
#   slurmpast   finished-job history  pypi.org/project/slurmpast
license = "MIT"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET", "PTH", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
