name: evals

# Not part of the push gate. Every case starts a real Claude child and a judge model
# scores its reply, so a full pass costs a couple of dollars and takes minutes, and a
# score is a sample rather than a measurement. Run it when the prose changes: on a
# release, or by hand.
on:
  workflow_dispatch:
    inputs:
      case:
        description: "case name glob (empty runs all of them)"
        required: false
        default: ""
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No key, no run. A fork's PR and a clone without the secret both land here,
      # and neither should look like a failing suite.
      - name: skip without a credential
        id: gate
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "ANTHROPIC_API_KEY is not set for this repository; skipping the suite" >&2
            echo "run=no" >> "$GITHUB_OUTPUT"
          else
            echo "run=yes" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'yes'
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code
        if: steps.gate.outputs.run == 'yes'

      # --mocks record (the default) keeps the real MCP server out of it, so nothing
      # here needs slurmwatch, sacct or a cluster. --ablation none because the
      # no-plugin delta is a design question for a human, not a merge gate.
      # --threshold 0.7 gates on a regression rather than on judge noise: one flipped
      # vote on a weight-2 grader already costs a case 0.33.
      - name: score the suite
        if: steps.gate.outputs.run == 'yes'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude plugin eval . \
            --trust-plugin \
            --no-publish \
            --ablation none \
            --threshold 0.7 \
            --max-cost-usd 8 \
            --concurrency 4 \
            --json evals-result.json \
            ${{ github.event.inputs.case && format('--case {0}', github.event.inputs.case) || '' }}

      - uses: actions/upload-artifact@v4
        if: always() && steps.gate.outputs.run == 'yes'
        with:
          name: eval-report
          path: |
            evals-result.json
            evals/results/**/report.html
          if-no-files-found: warn
